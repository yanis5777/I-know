<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>I Know</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="I Know">
<meta name="theme-color" content="#E8E2D5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E8E2D5;
    --paper:#F0EAE1;
    --paper-dark:#EAE2D5;
    --card-border:#D8CFC4;
    --ink:#1A1412;
    --ink-soft:#4F453C;
    --ph:#6B5F55;
    --stamp:#A32F1F;
    --airmail:#2B4C7E;
    --line:#D8CFC4;
    --gold:#B8862E;
    --action-bg:#2C2523;
    --action-text:#F0EAE1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  html,body{margin:0;padding:0;background:#E8E2D5;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Mono', monospace;
    min-height:100dvh;
  }

  /* Conteneur en flux normal, centré par margin:auto (pas de transform :
     un transform sur un ancêtre casse le position:fixed de ses enfants,
     c'était une partie du problème avec la nav plus tôt). Pas de hauteur
     forcée ni d'overflow:hidden au niveau de la page : on laisse le
     document respirer normalement, exactement comme dans l'app de
     référence qui fonctionne. */
  .shell{
    width:100%;
    max-width:460px;
    margin:0 auto;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding:env(safe-area-inset-top,6px) 16px 0;
    padding-bottom:var(--navh, 70px);
  }

  /* ---------- HEADER ---------- */
  .topbar{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:8px;
    padding:3px 2px 8px;
  }
  .topbar .logo-badge{
    width:28px; height:28px; flex-shrink:0;
    border-radius:8px;
    object-fit:contain;
  }
  .topbar .k1{
    font-size:10px;
    letter-spacing:0.16em;
    color:var(--ink-soft);
  }
  .topbar .k2{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-style:italic;
    font-size:19px;
    color:var(--ink);
  }

  /* ---------- MAIN CONTENT AREA ---------- */
  .content{
    flex:1;
    min-height:0;
    position:relative;
    overflow:hidden;
  }
  .view{
    position:absolute;
    inset:0;
    margin:6px 3px 42px;
    display:none;
    flex-direction:column;
    min-height:0;
  }
  .view.showing{ display:flex; }
  /* Marges propres à la carte : plus d'air en haut (sous le titre) et en
     bas (avant les pilules de nav), et un peu plus étroite sur les côtés
     pour ne pas toucher les bords — évite l'effet "étouffé". */
  #cardView{
    margin:16px 14px 50px;
  }

  /* ---------- STACK (pioche décorative) ---------- */
  .stack-wrap{
    position:relative;
    width:44%;
    max-width:190px;
    aspect-ratio:0.82;
    margin-bottom:6%;
    flex-shrink:1;
  }
  .stub{
    position:absolute;
    inset:0;
    border-radius:14px;
    border:1px solid var(--card-border);
    background:var(--paper-dark);
    box-shadow:0 6px 14px rgba(26,20,18,0.08);
  }
  .stub.s3{ transform:rotate(7deg) translate(4px,2px); }
  .stub.s2{ transform:rotate(-5deg) translate(-3px,4px); }
  .stub.s1{ display:flex; align-items:center; justify-content:center; overflow:hidden; }
  /* Respiration continue et discrète de la pile sur l'accueil, pour lui
     donner un peu de vie sans être distrayante. */
  .stack-wrap.deco .s1{ animation:floatS1 4.6s ease-in-out infinite; }
  .stack-wrap.deco .s2{ animation:floatS2 5.4s ease-in-out infinite .3s; }
  .stack-wrap.deco .s3{ animation:floatS3 5s ease-in-out infinite .6s; }
  @keyframes floatS1{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-3px) rotate(0.5deg); }
  }
  @keyframes floatS2{
    0%,100%{ transform:rotate(-5deg) translate(-3px,4px); }
    50%{ transform:rotate(-6deg) translate(-3px,1px); }
  }
  @keyframes floatS3{
    0%,100%{ transform:rotate(7deg) translate(4px,2px); }
    50%{ transform:rotate(6deg) translate(4px,-1px); }
  }
  .stub.s1 .stripes{
    position:absolute; inset:0;
    background:repeating-linear-gradient(-45deg,
      var(--paper-dark) 0 10px, var(--paper-dark) 10px 10px,
      var(--stamp) 10px 16px, var(--paper-dark) 16px 26px, var(--paper-dark) 26px 26px,
      var(--airmail) 26px 32px, var(--paper-dark) 32px 42px);
    -webkit-mask-image:linear-gradient(#000 0,#000 14px,transparent 14px,transparent calc(100% - 14px),#000 calc(100% - 14px));
    mask-image:linear-gradient(#000 0,#000 14px,transparent 14px,transparent calc(100% - 14px),#000 calc(100% - 14px));
    opacity:0.9;
  }
  .stub.s1 .compass{
    position:relative; z-index:2;
    width:34%; height:34%;
    border-radius:50%;
    border:1px solid var(--card-border);
    background:var(--paper);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .compass-logo{ width:62%; height:62%; object-fit:contain; }
  .stack-wrap.shuffle .s1{ animation:shuffle1 .55s ease; }
  .stack-wrap.shuffle .s2{ animation:shuffle2 .55s ease; }
  .stack-wrap.shuffle .s3{ animation:shuffle3 .55s ease; }
  @keyframes shuffle1{0%{transform:rotate(0) translate(0,0);}35%{transform:rotate(-10deg) translate(-14px,-10px) scale(1.02);}70%{transform:rotate(6deg) translate(10px,-6px);}100%{transform:rotate(0) translate(0,0);}}
  @keyframes shuffle2{0%{transform:rotate(-5deg) translate(-3px,4px);}35%{transform:rotate(10deg) translate(12px,-4px);}70%{transform:rotate(-8deg) translate(-8px,2px);}100%{transform:rotate(-5deg) translate(-3px,4px);}}
  @keyframes shuffle3{0%{transform:rotate(7deg) translate(4px,2px);}35%{transform:rotate(-9deg) translate(-10px,-2px);}70%{transform:rotate(9deg) translate(8px,4px);}100%{transform:rotate(7deg) translate(4px,2px);}}

  .draw-btn{
    width:100%;
    background:var(--action-bg);
    color:var(--action-text);
    border:none;
    border-radius:10px;
    padding:15px 18px;
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.05em;
    cursor:pointer;
    flex-shrink:0;
  }
  .draw-btn:active{ transform:translateY(1px); }
  .draw-btn:disabled{ opacity:0.55; }
  .home-note{
    margin-top:14px;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
    text-align:center;
    line-height:1.55;
    flex-shrink:0;
  }
  .home-note b{ color:var(--ink); }
  .theme-toggle{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:auto; align-self:center; margin-top:0; padding:11px 22px;
    background:linear-gradient(155deg, #EFE3C4, #E6D6A8);
    border:none; border-radius:999px;
    box-shadow:0 4px 14px rgba(184,134,46,0.22);
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; font-weight:700; letter-spacing:0.02em;
    color:#3D2E12; cursor:pointer;
    position:relative;
  }
  .theme-toggle svg{ width:16px; height:16px; flex-shrink:0; }
  .theme-toggle .chev{ width:14px; height:14px; transition:transform .2s ease; color:#3D2E12; }
  .theme-toggle.open{ box-shadow:inset 0 2px 6px rgba(184,134,46,0.28); }
  .theme-toggle.open .chev{ transform:rotate(180deg); }
  #themeToggle{
    background:transparent; color:#1A1A1A;
    border:1.5px solid #1A1A1A; box-shadow:none;
  }
  #themeToggle .chev{ color:#1A1A1A; }
  #themeToggle.open{ box-shadow:none; background:rgba(26,26,26,0.06); }
  #themeGrid{ margin-top:12px; }
  #themeGrid[hidden]{ display:none; }

  /* ---------- CARD VIEW ---------- */
  #cardView.showing{ animation:flipin .4s cubic-bezier(.2,.7,.3,1); }
  @keyframes flipin{0%{opacity:0;transform:rotateY(70deg) scale(.95);}100%{opacity:1;transform:rotateY(0) scale(1);}}
  .card.dealt{ animation:dealCard .38s cubic-bezier(.2,.7,.3,1); }
  @keyframes dealCard{
    0%{ opacity:0.4; transform:scale(0.94) rotate(-2deg); }
    60%{ opacity:1; transform:scale(1.015) rotate(0.5deg); }
    100%{ transform:scale(1) rotate(0); }
  }
  .card{
    flex:1;
    min-height:0;
    max-height:640px;
    display:flex;
    flex-direction:column;
    background:#F0EAE1;
    border:1px solid #D8CFC4;
    border-radius:14px;
    padding:14px 14px 12px;
    position:relative;
  }
  .card-head{
    flex-shrink:0;
    display:flex; justify-content:space-between; align-items:center;
  }
  .card-num{ font-size:10px; color:var(--ink-soft); letter-spacing:0.07em; }
  #cardNum{
    flex:1; text-align:center; font-size:13px; font-weight:700;
    color:var(--ink); letter-spacing:0.04em;
  }
  .card-exit-btn{
    width:36px; height:36px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(26,20,18,0.08); border:none; border-radius:50%;
    color:var(--ink); cursor:pointer;
  }
  .card-exit-btn svg{ width:19px; height:19px; }
  .card-title-wrap{ flex-shrink:0; text-align:center; margin:6px 0 12px; }
  .card-title{
    display:inline-block;
    font-family:'Fraunces', serif; font-weight:700; font-style:italic;
    font-size:16.5px;
    color:#2C4A63;
  }
  .star-btn{ background:none; border:none; cursor:pointer; padding:3px; color:var(--ink-soft); }
  .star-btn svg{ width:20px; height:20px; }
  .star-btn.active{ color:var(--gold); }
  .star-btn.active svg{ fill:var(--gold); }

  .items{
    flex:1;
    min-height:0;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:0.5em;
    font-size:16px;
  }
  /* Enveloppe qui permet de superposer l'indicateur de scroll par-dessus
     le bas de la liste, sans changer la mise en page de .items. */
  .items-outer{
    flex:1;
    min-height:0;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  .items-outer .items{ flex:1; }
  /* Dégradé + flèche qui indique qu'il y a du contenu à découvrir plus
     bas. Masqué automatiquement quand on est arrivé en bas de la liste,
     ou quand la carte tient déjà entièrement (pas besoin de scroller). */
  .scroll-hint{
    position:absolute;
    left:0; right:0; bottom:0;
    height:40px;
    display:none;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:2px;
    background:linear-gradient(to bottom, rgba(240,234,225,0) 0%, #F0EAE1 70%);
    pointer-events:none;
    opacity:1;
    transition:opacity .25s ease;
  }
  .scroll-hint.showing{ display:flex; }
  .scroll-hint.hidden{ opacity:0; }
  .scroll-hint svg{
    width:16px; height:16px;
    color:rgba(26,20,18,0.4);
    animation:hintBounce 1.3s ease-in-out infinite;
  }
  @keyframes hintBounce{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(4px); }
  }
  /* Vue "thème complet" : tous les mots d'une catégorie dans une seule
     carte, avec un vrai scroll interne (barre visible) au lieu du
     rétrécissement automatique du texte — pour réviser une thématique
     entière (famille, chiffres, couleurs...) sans revenir aux thèmes. */
  .items.scrollable{
    max-height:100%;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    justify-content:flex-start;
    scrollbar-width:thin;
    scrollbar-color:rgba(44,37,35,0.32) transparent;
  }
  .items.scrollable::-webkit-scrollbar{ width:5px; }
  .items.scrollable::-webkit-scrollbar-track{ background:transparent; }
  .items.scrollable::-webkit-scrollbar-thumb{ background:rgba(44,37,35,0.32); border-radius:4px; }
  .verb-table{
    width:100%; border-collapse:collapse;
    font-family:'IBM Plex Sans', sans-serif; font-size:11.5px;
  }
  .verb-table th{
    text-align:left; font-weight:600; color:var(--ink-soft);
    font-size:10px; letter-spacing:0.02em; text-transform:uppercase;
    padding:0 4px 8px; border-bottom:1.5px solid rgba(26,20,18,0.16);
  }
  .verb-table td{
    padding:9px 4px; border-bottom:1px solid rgba(26,20,18,0.09);
    color:var(--ink);
  }
  .verb-table td.subj{ font-weight:700; font-family:'Fraunces', serif; font-style:italic; }
  .verb-table tr:last-child td{ border-bottom:none; }
  .contraction-table{ font-size:15px; }
  .contraction-table th{ font-size:11px; }
  .contraction-table td{ padding:11px 6px; }
  .contraction-table td.subj{ color:#332B24; font-size:1.1em; }
  .verb-note{
    margin-top:18px; padding:14px 16px;
    background:var(--paper-dark); border-radius:10px;
    font-family:'IBM Plex Sans', sans-serif; font-size:13px;
    color:var(--ink); line-height:1.65;
  }
  .item{
    padding:0.55em 0.1em 0.7em;
    border-bottom:1.5px solid rgba(26,20,18,0.16);
    flex-shrink:0;
  }
  .item:last-child{ border-bottom:none; }
  .pair{ display:flex; flex-direction:column; align-items:flex-start; gap:0.2em; }
  .pair .fr{ font-family:'Fraunces', serif; font-weight:500; font-size:1.05em; color:#332B24; }
  .pair .en{
    font-family:'Inter', sans-serif; font-weight:600; font-size:1.05em;
    letter-spacing:0.015em;
    color:#1A1412;
    line-height:1.3;
  }
  .ph{ font-family:'IBM Plex Sans', sans-serif; font-style:italic; font-size:0.72em; color:#4A4038; margin-top:0.22em; }

  .fact-block{
    padding:0.6em 0.1em 0.85em;
    border-bottom:1.5px solid rgba(26,20,18,0.16);
    flex-shrink:0;
  }
  .fact-block:last-child{ border-bottom:none; }
  .fact-date{
    font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:0.92em;
    letter-spacing:0.03em; color:#6B3A12; margin-bottom:0.25em;
  }
  .fact-title{
    font-family:'Fraunces', serif; font-weight:600; font-size:1.08em;
    color:#1A1412; line-height:1.28; margin-bottom:0.3em;
  }
  .fact-summary{
    font-family:'IBM Plex Sans', sans-serif; font-size:1em; font-weight:500;
    color:#1A1412; line-height:1.5;
  }

  .flip-fact{ perspective:800px; cursor:pointer; }
  .flip-fact.flipping{ animation:factFlip .26s ease; }
  @keyframes factFlip{
    0%{ transform:rotateY(0deg); }
    50%{ transform:rotateY(90deg); }
    100%{ transform:rotateY(0deg); }
  }
  .flip-hint{
    flex-shrink:0; align-self:flex-end; margin-top:8px;
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; cursor:pointer;
    background:#1A1412; border-radius:999px;
    color:#fff;
  }
  .flip-hint[hidden]{ display:none; }
  .flip-hint svg{ width:18px; height:18px; }
  .fact-question{ font-style:italic; color:#4A4038; }
  .fact-points{ margin:0.3em 0 0.7em; padding-left:1.2em; }
  .fact-points li{
    font-family:'IBM Plex Sans', sans-serif; font-size:1em; font-weight:500;
    color:#1A1412; line-height:1.55; margin-bottom:0.35em;
  }

  .card-actions{
    flex-shrink:0;
    display:flex; gap:8px; margin-top:10px;
  }
  .btn-ghost{
    flex:1; min-height:46px;
    background:#E4DDD0; border:1.5px solid #D0C5B8; color:#2C2523;
    border-radius:11px; padding:12px 8px; font-family:'IBM Plex Mono', monospace;
    font-size:11px; font-weight:600; letter-spacing:0.02em; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .btn-ghost:disabled{ opacity:0.4; cursor:default; }
  .btn-solid{
    flex:1.3; min-height:46px;
    background:#2C2523; border:1.5px solid #2C2523; color:var(--action-text);
    border-radius:11px; padding:12px 8px; font-family:'IBM Plex Mono', monospace;
    font-size:11px; font-weight:600; letter-spacing:0.02em; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .btn-ghost:active,.btn-solid:active{ transform:translateY(1px); }

  /* ---------- CATEGORIES / CATEGORY VIEW ---------- */
  #categoriesView .list-head, #categoryView .list-head, #favView .list-head,
  #favThemesView .list-head, #favCardsView .list-head{
    flex-shrink:0; margin-bottom:18px;
  }
  .back-link{
    display:inline-flex; align-items:center; gap:6px;
    align-self:flex-start;
    background:var(--paper-dark); border:1.5px solid var(--card-border); border-radius:9px;
    padding:8px 14px; margin-bottom:14px;
    font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:600;
    color:var(--ink); cursor:pointer; flex-shrink:0;
  }
  .list-head .card-num{ color:var(--ink-soft); }
  .list-head .card-title{ font-size:17px; color:var(--ink); }
  #categoriesView, #favView{ justify-content:center; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  #categoryGrid, #favCategoryGrid{ flex:none; overflow-y:visible; width:100%; }
  .category-lead{
    font-family:'IBM Plex Sans', sans-serif; font-size:14px; font-weight:500;
    color:var(--ink); line-height:1.5; text-align:center;
    margin:0 0 16px; flex-shrink:0;
  }
  #categoriesView #globalDrawBtn{ margin:34px 0 14px; }
  #globalDrawBtn{
    background:#1A1A1A; color:#F7F4EB;
    border-radius:999px; box-shadow:none;
    padding:6px 13px;
  }
  #globalDrawBtn .chev{ color:#F7F4EB; }
  .dice-3d-wrap{
    display:inline-flex; width:27px; height:27px; flex-shrink:0;
    perspective:60px;
  }
  #globalDiceIcon{
    width:100%; height:100%;
    transform-style:preserve-3d;
    transform-origin:50% 55%;
    overflow:visible;
  }
  .dice-3d-wrap.rolling #globalDiceIcon{
    animation:diceRoll3d .68s cubic-bezier(.32,.9,.4,1.15);
  }
  @keyframes diceRoll3d{
    0%{   transform:rotateX(0deg) rotateY(0deg) scale(1); }
    30%{  transform:rotateX(180deg) rotateY(120deg) scale(1.22); }
    60%{  transform:rotateX(380deg) rotateY(260deg) scale(0.92); }
    85%{  transform:rotateX(460deg) rotateY(330deg) scale(1.08); }
    100%{ transform:rotateX(480deg) rotateY(360deg) scale(1); }
  }
  .category-sub{ margin:8px 0 0; font-size:12.5px; color:var(--ink); font-weight:500; }
  .category-center{
    flex:1; min-height:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px;
  }
  .category-center.compact{ flex:none; justify-content:flex-start; }
  .category-center[hidden]{ display:none; }
  .category-draw{ display:flex; flex-direction:column; align-items:center; gap:12px; }
  .category-draw[hidden]{ display:none; }
  .stack-wrap.small{ width:34%; max-width:130px; margin-bottom:0; }
  #categoryView .stack-wrap.small{ width:52%; max-width:210px; }
  #categoryStackWrap{
    animation:invitePulse 2.2s ease-in-out infinite;
    cursor:pointer;
  }
  @keyframes invitePulse{
    0%,60%,100%{ transform:scale(1); }
    30%{ transform:scale(1.045); }
  }
  .category-hint{
    margin-top:2px; width:78%; max-width:250px;
    font-family:'Fraunces', serif; font-style:italic; font-weight:600;
    font-size:17px; color:var(--ink); line-height:1.4;
  }
  #categoryStackWrap{ cursor:pointer; }
  #categoryStackWrap:active{ transform:scale(0.97); }
  .grid-list{
    flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    align-content:start;
    font-size:14px;
    padding-bottom:4px;
    padding-right:4px;
    scrollbar-width:thin;
    scrollbar-color:rgba(26,20,18,0.25) transparent;
  }
  .grid-list::-webkit-scrollbar{ width:5px; }
  .grid-list::-webkit-scrollbar-track{ background:transparent; }
  .grid-list::-webkit-scrollbar-thumb{ background:rgba(26,20,18,0.25); border-radius:4px; }
  .tile{
    background:var(--paper-dark);
    border:1px solid var(--card-border);
    border-radius:9px;
    padding:0.55em 0.6em;
    display:flex; flex-direction:column; justify-content:center;
    cursor:pointer;
  }
  .tile-theme{
    position:relative;
    border:none;
    min-height:76px;
    padding:0.7em 0.6em;
    overflow:hidden;
  }
  .tile-theme .name{ position:relative; z-index:1; color:#20180F; }
  .tile-theme .count{ position:relative; z-index:1; color:rgba(32,24,15,0.6); }
  .theme-emoji{
    position:absolute; right:-6px; bottom:-10px;
    font-size:42px; line-height:1;
    opacity:0.9; transform:rotate(-6deg);
    filter:drop-shadow(0 2px 3px rgba(0,0,0,0.12));
  }
  .tile .name{
    font-family:'Fraunces', serif; font-weight:600; font-size:1em; color:var(--ink);
    line-height:1.2;
  }
  .tile-available{
    box-shadow:0 3px 10px rgba(20,15,10,0.12);
  }
  .tile-soon{
    cursor:default;
    opacity:0.5;
  }
  .fav-group-label{
    font-size:10.5px; letter-spacing:0.1em; color:var(--ink-soft);
    margin:14px 2px 6px; flex-shrink:0;
  }
  .fav-group-label:first-child{ margin-top:0; }
  .tile .count{ font-size:0.72em; color:var(--ink-soft); margin-top:0.15em; }

  /* ---------- FAVORITES VIEW ---------- */
  .fav-list{
    flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    display:flex; flex-direction:column; justify-content:flex-start; gap:6px;
    font-size:14px;
    padding-bottom:4px;
    padding-right:4px;
    scrollbar-width:thin;
    scrollbar-color:rgba(26,20,18,0.25) transparent;
  }
  .fav-list::-webkit-scrollbar{ width:5px; }
  .fav-list::-webkit-scrollbar-track{ background:transparent; }
  .fav-list::-webkit-scrollbar-thumb{ background:rgba(26,20,18,0.25); border-radius:4px; }
  .fav-row{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--paper-dark); border:1px solid var(--card-border); border-radius:9px;
    padding:0.6em 0.8em; cursor:pointer; flex-shrink:0;
  }
  .fav-row .name{ font-family:'Fraunces', serif; font-weight:600; font-size:1em; color:var(--ink); }
  .fav-row .count{ font-size:0.72em; color:var(--ink-soft); }
  .fav-empty{
    display:flex; flex-direction:column; align-items:center;
    text-align:center; color:var(--ink-soft); font-size:12.5px; line-height:1.6;
    margin:auto; padding:0 24px;
  }
  .fav-empty-art{ width:120px; height:100px; margin-bottom:18px; }
  .fav-empty b{ color:var(--ink); font-size:1.05em; }

  /* ---------- BOTTOM NAV ----------
     Standards suivis :
     - bandeau propre, séparé du contenu par une ligne fine + son propre fond
     - zone de tap >= 44px de hauteur (repère Apple HIG / Material)
     - état actif vs inactif clairement distincts (couleur + graisse)
     - retour visuel au tap (:active)
     - aucune hauteur fixe : le bandeau se dimensionne par son contenu +
       padding, la safe-area iOS s'ajoute dynamiquement en plus, jamais
       à la place */
  /* ---------- BOTTOM NAV — style "Liquid Glass" ----------
     Trois pilules détachées, flottantes au-dessus du bord de l'écran,
     avec effet de verre translucide (backdrop-filter) plutôt qu'un
     bandeau plein. Le bouton actif se distingue par un fond plein
     (au lieu d'une couleur de texte différente sur fond uniforme). */
  .bottomnav{
    position:fixed;
    left:0; right:0; bottom:0;
    padding:0 16px calc(8px + env(safe-area-inset-bottom,0px));
    z-index:1000;
    pointer-events:none;
  }
  .nav-inner{
    display:flex;
    gap:8px;
    max-width:460px;
    margin:0 auto;
    pointer-events:auto;
  }
  .nav-btn{
    flex:1;
    min-height:44px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    background:rgba(240,234,225,0.55);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
    backdrop-filter:blur(20px) saturate(160%);
    border:1px solid rgba(255,255,255,0.5);
    border-radius:15px;
    box-shadow:0 3px 12px rgba(26,20,18,0.09);
    padding:4px 4px;
    font-family:'IBM Plex Mono', monospace;
    font-size:9px; letter-spacing:0.02em; font-weight:500;
    color:rgba(26,20,18,0.55);
    cursor:pointer;
    transition:background .18s ease, color .18s ease, box-shadow .18s ease;
  }
  .nav-btn:active{ box-shadow:0 2px 8px rgba(26,20,18,0.10); }
  .nav-btn svg{ width:17px; height:17px; stroke-width:1.6; transition:stroke-width .15s ease; }
  .nav-btn.active{
    background:var(--action-bg);
    border-color:var(--action-bg);
    color:var(--action-text);
    font-weight:700;
    box-shadow:0 6px 16px rgba(26,20,18,0.22);
  }
  .nav-btn.active svg{ stroke-width:2.2; }
</style>

  { id:"verb-be", cat:"To Be — Être", type:"conjugation", rows:[
    {s:"I", pr:"am", ps:"was", pc:"was being", fu:"will be"},
    {s:"You", pr:"are", ps:"were", pc:"were being", fu:"will be"},
    {s:"He / She", pr:"is", ps:"was", pc:"was being", fu:"will be"},
    {s:"We", pr:"are", ps:"were", pc:"were being", fu:"will be"},
    {s:"They", pr:"are", ps:"were", pc:"were being", fu:"will be"}
  ], note:"TO BE sert aussi d'auxiliaire pour le présent continu (I am eating). Il décrit un état permanent (I am French) ou temporaire (I am tired) — contrairement au français, jamais 'j'ai' pour l'âge : 'I am 25' (pas 'I have 25')."},
  { id:"verb-have", cat:"To Have — Avoir", type:"conjugation", rows:[
    {s:"I", pr:"have", ps:"had", pc:"was having", fu:"will have"},
    {s:"You", pr:"have", ps:"had", pc:"were having", fu:"will have"},
    {s:"He / She", pr:"has", ps:"had", pc:"was having", fu:"will have"},
    {s:"We", pr:"have", ps:"had", pc:"were having", fu:"will have"},
    {s:"They", pr:"have", ps:"had", pc:"were having", fu:"will have"}
  ], note:"HAVE sert aussi d'auxiliaire pour le Present Perfect (I have eaten). En anglais britannique, on dit souvent HAVE GOT pour la possession : 'I've got a car' = 'I have a car', même sens, juste plus courant à l'oral au Royaume-Uni."},
  { id:"verb-do", cat:"To Do / Make — Faire", type:"conjugation", rows:[
    {s:"I", pr:"do / make", ps:"did / made", pc:"was doing", fu:"will do"},
    {s:"You", pr:"do / make", ps:"did / made", pc:"were doing", fu:"will do"},
    {s:"He / She", pr:"does / makes", ps:"did / made", pc:"was doing", fu:"will do"},
    {s:"We", pr:"do / make", ps:"did / made", pc:"were doing", fu:"will do"},
    {s:"They", pr:"do / make", ps:"did / made", pc:"were doing", fu:"will do"}
  ], note:"DO = une action, une activité, une obligation générale (do homework, do the dishes, do a favor). MAKE = créer ou fabriquer quelque chose de concret (make a cake, make a decision, make a mistake). Astuce : DO pour ce qu'on accomplit, MAKE pour ce qu'on produit."},
  { id:"verb-go", cat:"To Go — Aller", type:"conjugation", rows:[
    {s:"I", pr:"go", ps:"went", pc:"was going", fu:"will go"},
    {s:"You", pr:"go", ps:"went", pc:"were going", fu:"will go"},
    {s:"He / She", pr:"goes", ps:"went", pc:"was going", fu:"will go"},
    {s:"We", pr:"go", ps:"went", pc:"were going", fu:"will go"},
    {s:"They", pr:"go", ps:"went", pc:"were going", fu:"will go"}
  ], note:"GO + -ING pour les activités et loisirs (go swimming, go shopping, go hiking). GO TO + lieu pour une destination précise (go to school, go to the cinema). Piège fréquent : jamais 'go to swimming'."},
  { id:"contractions1", cat:"Contractions — Be / Have (1/3)", type:"contractions", rows:[
    {full:"I am", short:"I'm"}, {full:"You are", short:"You're"},
    {full:"He is", short:"He's"}, {full:"She is", short:"She's"},
    {full:"It is", short:"It's"}, {full:"That is", short:"That's"},
    {full:"I have", short:"I've"}, {full:"You have", short:"You've"}
  ], note:"Les contractions sont OBLIGATOIRES dans la langue naturelle. 'I am' sonne formel ou robotique — 'I'm' est la norme, à l'écrit comme à l'oral."},
  { id:"contractions2", cat:"Contractions — Be / Have (2/3)", type:"contractions", rows:[
    {full:"We are", short:"We're"}, {full:"They are", short:"They're"},
    {full:"He has", short:"He's"}, {full:"She has", short:"She's"},
    {full:"We have", short:"We've"}, {full:"They have", short:"They've"},
    {full:"I would", short:"I'd"}, {full:"I will", short:"I'll"}
  ]},
  { id:"contractions3", cat:"Contractions — Négations (3/3)", type:"contractions", rows:[
    {full:"do not", short:"don't"}, {full:"does not", short:"doesn't"},
    {full:"did not", short:"didn't"}, {full:"will not", short:"won't"},
    {full:"cannot", short:"can't"}, {full:"is not", short:"isn't"},
    {full:"are not", short:"aren't"}, {full:"could not", short:"couldn't"}
  ], note:"'He's' peut vouloir dire 'He is' OU 'He has' selon le contexte : 'He's tired' (is) mais 'He's finished' (has). Le verbe qui suit indique lequel."},
  { id:"verb2-come", cat:"To Come — Venir", type:"conjugation", rows:[
    {s:"I", pr:"come", ps:"came", pc:"was coming", fu:"will come"},
    {s:"You", pr:"come", ps:"came", pc:"were coming", fu:"will come"},
    {s:"He / She", pr:"comes", ps:"came", pc:"was coming", fu:"will come"},
    {s:"We", pr:"come", ps:"came", pc:"were coming", fu:"will come"},
    {s:"They", pr:"come", ps:"came", pc:"were coming", fu:"will come"}
  ], note:"COME = venir, se déplacer vers la personne qui parle ou vers le lieu dont on parle (Come here! / She's coming to my party). GO = aller, se déplacer loin du locuteur (I'm going to Paris). Le sens dépend du point de vue : si tu invites quelqu'un chez toi, il 'comes', pas 'goes'."},
  { id:"verb2-stay", cat:"To Stay — Rester", type:"conjugation", rows:[

  { id:"verb2-eat", cat:"To Eat — Manger", type:"conjugation", rows:[

  { id:"verb2-understand", cat:"To Understand — Comprendre", type:"conjugation", rows:[

  { id:"pol-roi-clovis", cat:"Clovis Ier (466-511)", type:"facts", rows:[{date:"👑", title:"Clovis Ier (466-511)", intro:"Roi des Francs saliens, Clovis mène une série de conquêtes militaires qui lui permettent d'unifier progressivement les royaumes francs sous son autorité. Vers 496, sous l'influence de son épouse Clotilde, il se convertit au christianisme et se fait baptiser à Reims, un choix religieux rare chez les rois germaniques de l'époque. Cette conversion rapproche durablement les Francs de la papauté et de la population gallo-romaine déjà chrétienne, posant les fondations du futur royaume de France.", points:["Premier roi des Francs.","Unifie les tribus franques.","Se fait baptiser chrétien, ce qui fonde le royaume."]}] },
  { id:"pol-roi-charlemagne", cat:"Charlemagne (742-814)", type:"facts", rows:[{date:"👑", title:"Charlemagne (742-814)", intro:"Roi des Francs à partir de 768, Charlemagne étend considérablement le royaume par de nombreuses campagnes militaires, jusqu'à être couronné Empereur d'Occident par le pape Léon III en l'an 800. Son règne est marqué par une intense activité administrative : il réorganise l'empire en comtés, impose une monnaie unique et lance la Renaissance carolingienne, avec la création d'écoles dans les monastères. Son empire ne survivra pas longtemps à sa mort, mais son modèle politique influencera l'Europe médiévale pendant des siècles.", points:["Roi des Francs, devient Empereur d'Occident en 800.","Lance la Renaissance carolingienne.","Favorise le développement des écoles."]}] },
  { id:"pol-roi-hugues-capet", cat:"Hugues Capet (941-996)", type:"facts", rows:[{date:"👑", title:"Hugues Capet (941-996)", intro:"Élu roi des Francs en 987 par les grands seigneurs du royaume, Hugues Capet met fin à la dynastie carolingienne et fonde la dynastie des Capétiens. Son royaume est en réalité modeste, limité à un territoire autour de Paris et d'Orléans, la plupart des grands féodaux étant bien plus puissants que lui. Sa décision de faire couronner son fils Robert de son vivant permet de transformer la couronne élective en couronne héréditaire, un principe qui structurera la monarchie française pendant huit siècles.", points:["Fondateur de la dynastie des Capétiens.","Rend la couronne héréditaire."]}] },
  { id:"pol-roi-philippe2", cat:"Philippe II Auguste (1165-1223)", type:"facts", rows:[{date:"👑", title:"Philippe II Auguste (1165-1223)", intro:"Philippe II Auguste consacre une grande partie de son règne à affaiblir la puissance des rois d'Angleterre, alors maîtres d'un vaste empire continental. Il leur reprend la Normandie et plusieurs autres provinces françaises. Sa victoire décisive à la bataille de Bouvines en 1214, contre une coalition anglo-germanique, renforce durablement le prestige et l'autorité de la couronne. C'est également sous son règne que Paris se dote de remparts et de rues pavées, devenant une véritable capitale politique.", points:["Remporte la victoire de Bouvines (1214).","Reprend des terres à la couronne anglaise.","Fait de Paris la véritable capitale du royaume."]}] },
  { id:"pol-roi-louis9", cat:"Saint Louis / Louis IX (1214-1270)", type:"facts", rows:[{date:"👑", title:"Saint Louis / Louis IX (1214-1270)", intro:"Profondément pieux, Louis IX incarne l'idéal du roi chrétien médiéval, au point d'être canonisé après sa mort. Il réforme en profondeur la justice royale, en instaurant la possibilité de faire appel des décisions des seigneurs directement devant le roi, et crée une monnaie royale unique, le gros tournois, pour renforcer l'autorité économique de la couronne. Il participe aussi à deux croisades, la seconde lui coûtant la vie devant Tunis. Son règne est souvent considéré comme un apogée de la monarchie médiévale française.", points:["Roi pieux et réformateur.","Crée le gros tournois, une monnaie unique.","Développe la justice royale."]}] },
  { id:"pol-roi-philippe4", cat:"Philippe IV le Bel (1268-1314)", type:"facts", rows:[{date:"👑", title:"Philippe IV le Bel (1268-1314)", intro:"Philippe IV le Bel renforce considérablement l'autorité royale face aux pouvoirs traditionnels, notamment celui de l'Église. Son conflit avec le pape Boniface VIII, qu'il fait humilier, illustre sa volonté d'affranchir la couronne de la tutelle pontificale. En 1302, il convoque pour la première fois les États généraux, une assemblée représentant le clergé, la noblesse et le peuple, afin d'obtenir un soutien politique élargi. Il ordonne également la dissolution brutale de l'ordre des Templiers entre 1307 et 1312, dont il convoite les richesses.", points:["Entre en conflit avec la papauté.","Crée les États généraux.","Dissout l'ordre des Templiers."]}] },
  { id:"pol-roi-francois1", cat:"François Ier (1494-1547)", type:"facts", rows:[{date:"👑", title:"François Ier (1494-1547)", intro:"François Ier incarne l'arrivée de la Renaissance italienne en France. Grand mécène, il attire à sa cour des artistes comme Léonard de Vinci, qui passera ses dernières années au Clos Lucé, et fait construire ou transformer plusieurs châteaux emblématiques comme Chambord ou Fontainebleau. Sur le plan administratif, il signe en 1539 l'ordonnance de Villers-Cotterêts, qui impose le français comme langue des actes officiels à la place du latin. Son règne est aussi marqué par une rivalité constante avec l'empereur Charles Quint.", points:["Roi de la Renaissance française.","Mécène de Léonard de Vinci.","Signe l'ordonnance de Villers-Cotterêts : le français devient langue officielle."]}] },
  { id:"pol-roi-henri4", cat:"Henri IV (1553-1610)", type:"facts", rows:[{date:"👑", title:"Henri IV (1553-1610)", intro:"Après des décennies de guerres de Religion entre catholiques et protestants, Henri IV, lui-même ancien chef protestant converti au catholicisme, parvient à ramener la paix civile dans le royaume. En 1598, il signe l'édit de Nantes, qui accorde aux protestants une liberté de culte limitée mais réelle, une mesure de tolérance religieuse rare pour l'époque. Son règne relance également l'économie du royaume, avec le soutien de son ministre Sully, et lui vaut une image durable de roi proche du peuple.", points:["Met fin aux guerres de Religion.","Signe l'édit de Nantes (1598).","Amorce une période de pacification et de prospérité."]}] },
  { id:"pol-roi-louis14", cat:"Louis XIV (1638-1715)", type:"facts", rows:[{date:"👑", title:"Louis XIV (1638-1715)", intro:"Louis XIV règne personnellement pendant plus de 72 ans, le règne le plus long de l'histoire de France. Après la Fronde, il s'installe à Versailles, dont il fait un palais somptueux destiné à impressionner l'Europe entière et à tenir la noblesse sous étroite surveillance. Son règne incarne l'apogée de la monarchie absolue de droit divin, résumée par la formule qu'on lui attribue : « L'État, c'est moi ». Il multiplie aussi les guerres pour agrandir le royaume, ce qui finit par épuiser les finances publiques.", points:["Surnommé le « Roi-Soleil ».","Symbole de la monarchie absolue.","Fait construire le château de Versailles.","Fait rayonner la culture française dans toute l'Europe."]}] },
  { id:"pol-roi-louis16", cat:"Louis XVI (1754-1793)", type:"facts", rows:[{date:"👑", title:"Louis XVI (1754-1793)", intro:"Louis XVI monte sur le trône en 1774 dans un royaume déjà fragilisé par une dette publique considérable. Malgré plusieurs tentatives de réforme financière, il ne parvient pas à résoudre la crise budgétaire ni à répondre aux attentes croissantes de la population. La convocation des États généraux en 1789 déclenche la Révolution française, qui met rapidement fin à la monarchie absolue. Arrêté après une tentative de fuite, il est jugé, condamné et guillotiné en 1793, devenant le seul roi de France exécuté.", points:["Dernier roi de l'Ancien Régime.","Règne marqué par la Révolution française.","Guillotiné en 1793."]}] }
];

function getFavs(){ try{ return JSON.parse(localStorage.getItem(FAV_KEY)) || []; }catch(e){ return []; } }
function setFavs(arr){
  localStorage.setItem(FAV_KEY, JSON.stringify(arr));
  document.getElementById("favLabel").textContent = arr.length ? `Favoris (${arr.length})` : "Favoris";
}
function toggleFav(id){
  let favs = getFavs();

function showView(name){
  Object.values(views).forEach(v=>v.classList.remove("showing"));
  views[name].classList.add("showing");
  let activeTab = name;
  if(name === "category") activeTab = "categories";
  if(name === "favThemes" || name === "favCards") activeTab = "favorites";
  if(name === "card") activeTab = ctx.origin === "favorites" ? "favorites" : "categories";
  navBtns.forEach(b=> b.classList.toggle("active", b.dataset.tab===activeTab));
}

function pickRandom(pool, deck){
  deck = deck || DECK;
  const source = pool ? deck.filter(c=>pool.includes(c.id)) : deck;
  let choices = source;
  if(source.length > 1) choices = source.filter(c=>c.id!==lastId);
  const card = choices[Math.floor(Math.random()*choices.length)];
  lastId = card.id;
  return card;
}

/* Masque l'indicateur de scroll une fois qu'on approche du bas de la
   liste, ou s'il n'y a en fait rien à scroller (peu de mots). */
function updateScrollHint(){
  const wrap = document.getElementById("itemsWrap");
  const hint = document.getElementById("scrollHint");
  if(!hint.classList.contains("showing")) return;
  const canScroll = wrap.scrollHeight > wrap.clientHeight + 2;
  const atBottom = wrap.scrollTop + wrap.clientHeight >= wrap.scrollHeight - 4;
  hint.classList.toggle("hidden", !canScroll || atBottom);
}
document.getElementById("itemsWrap").addEventListener("scroll", updateScrollHint);

function renderCard(card, fromHistory){

    card.rows.forEach(r=>{
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${r.full}</td><td class="subj">${r.short}</td>`;
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    if(card.note){
      const note = document.createElement("div");
      note.className = "verb-note";
      note.textContent = card.note;
      wrap.appendChild(note);
    }
  } else if(card.type === "irregular"){
    const table = document.createElement("table");
    table.className = "verb-table";
    table.innerHTML = `<thead><tr><th>Infinitif</th><th>Passé</th><th>Participe</th></tr></thead>`;
    const tbody = document.createElement("tbody");
    card.rows.forEach(r=>{
      const tr = document.createElement("tr");
      tr.innerHTML = `<td class="subj">${r.inf}</td><td>${r.past}</td><td>${r.part}</td>`;
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    if(card.note){
      const note = document.createElement("div");
      note.className = "verb-note";
      note.textContent = card.note;
      wrap.appendChild(note);
    }
  } else if(card.type === "facts"){
    card.rows.forEach(r=>{
      const div = document.createElement("div");
      if(r.points){
        div.className = "fact-block flip-fact";
        const pointsHtml = r.points.map(p=>`<li>${p}</li>`).join("");
        div.innerHTML = `
          <div class="fact-flip-face front">
            <div class="fact-date">${r.date}</div>
            <div class="fact-title">${r.title}</div>
            <div class="fact-summary">${r.intro || r.question || ""}</div>
          </div>
          <div class="fact-flip-face back" hidden>
            <div class="fact-date">${r.date}</div>
            <div class="fact-title">${r.title}</div>
            <ul class="fact-points">${pointsHtml}</ul>
          </div>`;
        div.addEventListener("click", ()=>{
          div.classList.add("flipping");
          setTimeout(()=>{
            const faces = div.querySelectorAll(".fact-flip-face");
            faces.forEach(f=>f.hidden = !f.hidden);
          }, 130);
          setTimeout(()=>div.classList.remove("flipping"), 260);
        });
      } else {
        div.className = "fact-block";
        div.innerHTML = `<div class="fact-date">${r.date}</div><div class="fact-title">${r.title}</div><div class="fact-summary">${r.summary}</div>`;
      }
      wrap.appendChild(div);
    });
  } else {
    card.items.forEach(([fr,en,ph])=>{
      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML = `<div class="pair"><span class="fr">${fr}</span><span class="en">${en}</span></div><div class="ph">/${ph}/</div>`;
      wrap.appendChild(div);
    });
  }

  const starBtn = document.getElementById("starBtn");
  const anotherBtn = document.getElementById("anotherBtn");
  const prevBtn = document.getElementById("prevBtn");
  const scrollHint = document.getElementById("scrollHint");
  const flipHint = document.getElementById("flipHint");
  const merged = !!card.merged;
  const count = card.items ? card.items.length : card.rows.length;
  wrap.classList.add("scrollable");
  scrollHint.classList.add("showing");
  prevBtn.disabled = cardHistory.length === 0;

  const catLabel = catForCard ? catForCard.icon + " " + catForCard.label : "";

  };
  document.getElementById("cardTitle").textContent = card.cat;

  wrap.scrollTop = 0;
  showView("card");
  requestAnimationFrame(updateScrollHint);
}

/* Retrouve une carte à partir de son id, qu'il s'agisse d'une carte
   normale du paquet ou d'un thème complet enregistré en favori
   (id préfixé "theme-"). */
function buildThemeCard(family){
  let deck = DECK;
  for(const catId in CATEGORY_DATA){
    if(CATEGORY_DATA[catId].families.includes(family)){ deck = CATEGORY_DATA[catId].deck; break; }
  }
  const cards = deck.filter(c=>family.cardIds.includes(c.id));
  const items = cards.filter(c=>c.items).flatMap(c=>c.items);
  return { id:"theme-"+family.id, cat:family.label, items, merged:true };
}
function resolveCardById(id){
  if(id.indexOf("theme-") === 0){
    for(const catId in CATEGORY_DATA){
      const family = CATEGORY_DATA[catId].families.find(f=>"theme-"+f.id === id);
      if(family) return buildThemeCard(family);
    }
    return null;
  }
  for(const catId in CATEGORY_DATA){
    const found = CATEGORY_DATA[catId].deck.find(c=>c.id===id);
    if(found) return found;
  }
  return null;
}
/* Identifiant du thème (famille) d'une carte favorite, qu'elle soit une
   carte normale ou un thème complet enregistré en favori. */
function familyIdForCard(card){
  if(card.merged) return card.id.slice(6);
  const catId = categoryIdForCard(card);
  const fam = CATEGORY_DATA[catId].families.find(f=>f.cardIds.includes(card.id));
  return fam ? fam.id : "autres";
}

}

/* Pioche dans absolument tout le contenu existant de toutes les
   catégories disponibles, tous thèmes confondus. */
function drawGlobalRandom(){
  const diceWrap = document.getElementById("globalDiceWrap");
  diceWrap.classList.remove("rolling");
  void diceWrap.offsetWidth; // relance l'animation même si on clique plusieurs fois vite
  diceWrap.classList.add("rolling");
  setTimeout(()=>{
    diceWrap.classList.remove("rolling");
    cardHistory = []; currentCard = null;
    ctx = { origin:"globalRandom", categoryId:null, pool:null };
    renderCard(pickRandom(null, combinedAvailableDeck()));
  }, 600);
}

function drawWithinTheme(family){
  cardHistory = []; currentCard = null;
  ctx = { origin:"categoryTheme", categoryId:currentCategory.id, pool:family.cardIds };
  renderCard(pickRandom(family.cardIds, CATEGORY_DATA[currentCategory.id].deck));
}

function openFavorite(card){
  cardHistory = []; currentCard = null;
  ctx = { origin:"favorites", categoryId:null, pool:null };
  renderCard(card);
}

document.getElementById("categoryStackWrap").addEventListener("click", drawCategoryRandom);
document.getElementById("anotherBtn").addEventListener("click", ()=>{
  const deck = ctx.origin === "globalRandom" ? combinedAvailableDeck() : CATEGORY_DATA[ctx.categoryId].deck;
  renderCard(pickRandom(ctx.pool, deck));
});
document.getElementById("prevBtn").addEventListener("click", ()=>{
  if(cardHistory.length === 0) return;
  const prev = cardHistory.pop();
  renderCard(prev, true);
});
document.getElementById("cardExitBtn").addEventListener("click", ()=>{
  cardHistory = [];
  currentCard = null;
  if(ctx.origin === "categoryRandom" || ctx.origin === "categoryTheme"){
    const cat = CATEGORIES.find(c=>c.id===ctx.categoryId) || currentCategory;
    openCategory(cat, { expandThemes: ctx.origin === "categoryTheme" });
  } else if(ctx.origin === "globalRandom"){
    renderCategories(); showView("categories");
  } else if(ctx.origin === "favorites"){
    if(favCtx.familyId){
      const cards = getFavs().map(resolveCardById).filter(Boolean).filter(c=>familyIdForCard(c)===favCtx.familyId);
      renderFavCards(cards);
      showView("favCards");
    } else {
      renderFavCategories(); showView("favorites");
    }
  } else {
    renderCategories(); showView("categories");
  }
});
document.getElementById("globalDrawBtn").addEventListener("click", drawGlobalRandom);

function renderCategories(){
  const grid = document.getElementById("categoryGrid");
  grid.innerHTML = "";
  CATEGORIES.forEach(cat=>{
    const tile = document.createElement("div");
    tile.className = "tile tile-theme" + (cat.available ? " tile-available" : " tile-soon");
    tile.style.background = cat.bg;
    if(cat.available){
      tile.innerHTML = `<span class="theme-emoji">${cat.icon}</span><div class="name">${cat.label}</div>`;
      tile.addEventListener("click", ()=> openCategory(cat));
    } else {
      tile.innerHTML = `<span class="theme-emoji">${cat.icon}</span><div class="name">${cat.label}</div><div class="count">Bientôt</div>`;
    }
    grid.appendChild(tile);
  });
}

function renderThemesForCategory(cat){
  const grid = document.getElementById("themeGrid");
  grid.innerHTML = "";
  const data = CATEGORY_DATA[cat.id];
  if(!data){ return; }
  const sorted = [...data.families].sort((a,b)=> a.label.localeCompare(b.label, "fr"));
  sorted.forEach(family=>{
    const cards = data.deck.filter(c=>family.cardIds.includes(c.id));
    const wordCount = cards.reduce((sum,c)=>sum+(c.items ? c.items.length : c.rows.length),0);
    const style = data.theme_style[family.id] || {bg:"var(--paper-dark)", emoji:"📖"};
    const tile = document.createElement("div");
    tile.className = "tile tile-theme";
    tile.style.background = style.bg;
    tile.innerHTML = `<span class="theme-emoji">${style.emoji}</span><div class="name">${family.label}</div><div class="count">${wordCount} ${cat.unit || "mots"}</div>`;
    tile.addEventListener("click", ()=> drawWithinTheme(family));
    grid.appendChild(tile);
  });
}


navBtns.forEach(btn=>{
  btn.addEventListener("click", ()=>{
    cardHistory = []; currentCard = null;
    const tab = btn.dataset.tab;
    if(tab === "categories") renderCategories();
    if(tab === "favorites") renderFavCategories();
    showView(tab);
  });
});

function syncNavHeight(){
  const navH = document.querySelector(".bottomnav").offsetHeight;
  document.documentElement.style.setProperty("--navh", navH + "px");
}

setFavs(getFavs());
renderCategories();
syncNavHeight();
window.addEventListener("resize", ()=>{
  syncNavHeight();
  if(views.card.classList.contains("showing")){
    updateScrollHint();
  }
});
window.addEventListener("orientationchange", syncNavHeight);
</script>
</body>
